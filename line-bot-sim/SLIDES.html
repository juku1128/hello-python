              <div>🔹 <span class="text-[#EB459E]">0d7ced1</span> : 支援多輪上下文記憶與深度新聞分析</div>
              <div>🔹 <span class="text-[#FEE75C]">b001a83</span> : 修復 macOS AirPlay 通訊埠衝突（Port 5001）</div>
            </div>
            <p class="text-[#9ea3c7]">
              證明每一次的功能升級與問題排除，都有完整的工程透明度可受檢驗。
            </p>
          </div>
        `
      },
      {
        tag: "10 · 專案總結",
        badge: "報告結語",
        title: "總結：從專案中學到的重要能力",
        body: `
          <div class="space-y-2 text-xs leading-relaxed">
            <div class="p-2 rounded-xl bg-[#181a38] border border-[#2e3366]">
              <div class="font-bold text-[#5865F2]">1. AI 原生開發新思維（雙 Agent 協同）</div>
              <div class="text-[#9ea3c7] text-[11px]">體會身為「產品經理」如何指揮 Antigravity 與 OpenCode 實現複雜全端系統。</div>
            </div>
            <div class="p-2 rounded-xl bg-[#181a38] border border-[#2e3366]">
              <div class="font-bold text-[#EB459E]">2. 本地開源大模型與隱私保護</div>
              <div class="text-[#9ea3c7] text-[11px]">驗證本機 3B 模型在 Mac 上的流暢度，證明無需付費商業 API 也能建立高品質應用。</div>
            </div>
            <div class="p-2 rounded-xl bg-[#181a38] border border-[#2e3366]">
              <div class="font-bold text-[#57F287]">3. RAG 實時檢索與多輪對話落地</div>
              <div class="text-[#9ea3c7] text-[11px]">完整理解外部資料檢索如何賦予 AI 實時感知能力，成功交付高完成度專案！</div>
            </div>
          </div>
        `
      }
    ];

    let currentSlide = 0;

    const slideContentEl = document.getElementById("slideContent");
    const slideCounterEl = document.getElementById("slideCounter");
    const progressBarEl = document.getElementById("progressBar");
    const prevBtn = document.getElementById("prevBtn");
    const nextBtn = document.getElementById("nextBtn");
    const dotContainerEl = document.getElementById("dotContainer");

    slides.forEach((_, i) => {
      const dot = document.createElement("button");
      dot.className = "w-2 h-2 rounded-full transition-all flex-shrink-0 " + (i === 0 ? "bg-[#5865F2] w-3.5 shadow-sm shadow-[#5865F2]" : "bg-[#2b2f5c]");
      dot.addEventListener("click", () => goToSlide(i));
      dotContainerEl.appendChild(dot);
    });

    function updateDots() {
      const dots = dotContainerEl.querySelectorAll("button");
      dots.forEach((dot, i) => {
        if (i === currentSlide) {
          dot.className = "h-2 rounded-full transition-all bg-[#5865F2] w-3.5 flex-shrink-0 shadow-sm shadow-[#5865F2]";
        } else {
          dot.className = "w-2 h-2 rounded-full transition-all bg-[#2b2f5c] hover:bg-[#5865F2]/50 flex-shrink-0";
        }
      });
    }

    function renderSlide() {
      const s = slides[currentSlide];
      slideCounterEl.textContent = `${currentSlide + 1} / ${slides.length}`;
      progressBarEl.style.width = `${((currentSlide + 1) / slides.length) * 100}%`;

      slideContentEl.innerHTML = `
        <div class="flex flex-col justify-center">
          <div class="flex items-center justify-between mb-1.5">
            <span class="text-xs font-mono font-semibold tracking-wider text-[#7983F5] uppercase">${s.tag}</span>
            <span class="text-[10px] font-semibold bg-[#1e2246] text-[#c4c9ff] px-2 py-0.5 rounded-md border border-[#3f4585]">${s.badge}</span>
          </div>
          <h3 class="text-sm sm:text-base font-bold text-white mb-2 leading-snug">${s.title}</h3>
          ${s.body}
        </div>
      `;

      prevBtn.disabled = currentSlide === 0;
      if (currentSlide === slides.length - 1) {
        nextBtn.innerHTML = "<span>回到首頁</span> ↺";
        nextBtn.className = "px-3.5 py-1 text-xs font-bold rounded-lg bg-[#57F287] text-slate-900 hover:bg-[#45d972] shadow-md shadow-[#57F287]/30 transition flex items-center gap-1";
      } else {
        nextBtn.innerHTML = "<span>下一頁</span> →";
        nextBtn.className = "px-3.5 py-1 text-xs font-bold rounded-lg bg-[#5865F2] text-white hover:bg-[#4752C4] shadow-md shadow-[#5865F2]/40 transition flex items-center gap-1";
      }

      updateDots();
    }

    function goToSlide(index) {
      if (index >= 0 && index < slides.length) {
        currentSlide = index;
        renderSlide();
      }
    }

    prevBtn.addEventListener("click", () => goToSlide(currentSlide - 1));
    nextBtn.addEventListener("click", () => {
      if (currentSlide < slides.length - 1) {
        goToSlide(currentSlide + 1);
      } else {
        goToSlide(0);
      }
    });

    window.addEventListener("keydown", (e) => {
      if (e.key === "ArrowLeft") goToSlide(currentSlide - 1);
      if (e.key === "ArrowRight") goToSlide(currentSlide + 1);
    });

    renderSlide();
  </script>
</body>
</html>
