<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <script src="https://www.gstatic.com/antigravity/web/dev/tailwindcss.min.js"></script>
</head>
<body class="bg-transparent text-[var(--foreground)] antialiased p-2 select-none">
  <div class="bg-[var(--card)] border border-[var(--border)] rounded-2xl p-5 shadow-lg max-w-xl mx-auto flex flex-col justify-between" style="min-height: 460px;">
    
    <!-- 頂部資訊與進度條 -->
    <div class="border-b border-[var(--border)] pb-3">
      <div class="flex items-center justify-between text-xs text-[var(--muted-foreground)] mb-1.5">
        <span class="font-medium flex items-center gap-1.5">
          <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
          期末專案報告 · LINE Bot 本地開源 AI 即時新聞系統
        </span>
        <span id="slideCounter" class="font-mono bg-[var(--secondary)] text-[var(--secondary-foreground)] px-2 py-0.5 rounded-full font-semibold">1 / 8</span>
      </div>
      <div class="w-full bg-[var(--secondary)] h-1.5 rounded-full overflow-hidden">
        <div id="progressBar" class="bg-emerald-500 h-full transition-all duration-300 ease-out" style="width: 12.5%;"></div>
      </div>
    </div>

    <!-- 簡報內容本體 -->
    <div id="slideContent" class="py-3 flex-1 flex flex-col justify-center"></div>

    <!-- 底部切換按鈕 -->
    <div class="border-t border-[var(--border)] pt-3 flex items-center justify-between">
      <button id="prevBtn" class="px-3.5 py-1.5 text-xs font-medium rounded-lg border border-[var(--border)] bg-[var(--secondary)] text-[var(--secondary-foreground)] hover:opacity-80 transition disabled:opacity-30 disabled:cursor-not-allowed">
        ← 上一頁
      </button>

      <div id="dotContainer" class="flex gap-1.5"></div>

      <button id="nextBtn" class="px-4 py-1.5 text-xs font-semibold rounded-lg bg-emerald-600 text-white hover:bg-emerald-700 transition flex items-center gap-1">
        <span>下一頁</span> →
      </button>
    </div>

  </div>

  <script>
    const slides = [
      {
        tag: "01 · 專案首頁",
        badge: "成果報告",
        title: "LINE Bot × 本地開源 AI 即時新聞系統",
        body: `
          <div class="space-y-3">
            <div class="p-3 rounded-xl bg-emerald-500/10 border border-emerald-500/20 text-xs leading-relaxed">
              <span class="font-bold text-emerald-600 dark:text-emerald-400">🎯 專案核心題目：</span><br>
              基於 <strong>OpenCode</strong> 結對開發、<strong>Ollama 本地開源大模型</strong>與 <strong>RAG 即時新聞檢索</strong>之 LINE 智慧助理。
            </div>
            <div class="grid grid-cols-2 gap-2 text-xs">
              <div class="p-2.5 rounded-lg bg-[var(--secondary)] border border-[var(--border)]">
                <div class="font-bold text-blue-500">👨‍💻 開發方式</div>
                <div class="text-[var(--muted-foreground)]">AI 原生開發（OpenCode Agent）</div>
              </div>
              <div class="p-2.5 rounded-lg bg-[var(--secondary)] border border-[var(--border)]">
                <div class="font-bold text-purple-500">🦙 本地模型</div>
                <div class="text-[var(--muted-foreground)]">Ollama · Qwen 2.5 (3B)</div>
              </div>
              <div class="p-2.5 rounded-lg bg-[var(--secondary)] border border-[var(--border)]">
                <div class="font-bold text-emerald-500">📰 新聞架構</div>
                <div class="text-[var(--muted-foreground)]">Google News RSS 動態檢索</div>
              </div>
              <div class="p-2.5 rounded-lg bg-[var(--secondary)] border border-[var(--border)]">
                <div class="font-bold text-amber-500">💬 使用者介面</div>
                <div class="text-[var(--muted-foreground)]">LINE 擬真行動版 Web 系統</div>
              </div>
            </div>
          </div>
        `
      },
      {
        tag: "02 · 作業核對",
        badge: "100% 達成",
        title: "是否符合老師的作業要求？（逐條驗證）",
        body: `
          <div class="space-y-2 text-xs leading-relaxed">
            <div class="p-2 rounded-lg bg-[var(--secondary)] border border-[var(--border)] flex items-start gap-2">
              <span class="text-emerald-500 font-bold">✅</span>
              <div>
                <span class="font-bold">要求 1：請用 OpenCode</span><br>
                <span class="text-[var(--muted-foreground)]">完成：全程以 OpenCode 指揮建置專案，歷經初始架構、關鍵字搜尋、多輪對話三次迭代。</span>
              </div>
            </div>
            <div class="p-2 rounded-lg bg-[var(--secondary)] border border-[var(--border)] flex items-start gap-2">
              <span class="text-emerald-500 font-bold">✅</span>
              <div>
                <span class="font-bold">要求 2：使用本地開源模型</span><br>
                <span class="text-[var(--muted-foreground)]">完成：採用 Ollama 本機運行 Qwen 2.5 (3B)，全程離線推理，不花費外部 API，保護資料隱私。</span>
              </div>
            </div>
            <div class="p-2 rounded-lg bg-[var(--secondary)] border border-[var(--border)] flex items-start gap-2">
              <span class="text-emerald-500 font-bold">✅</span>
              <div>
                <span class="font-bold">要求 3：完成 LINE Bot</span><br>
                <span class="text-[var(--muted-foreground)]">完成：打造擬真度 100% 的 LINE 手機版聊天室系統（綠色主題/氣泡/打字動畫/快捷按鈕）。</span>
              </div>
            </div>
            <div class="p-2 rounded-lg bg-[var(--secondary)] border border-[var(--border)] flex items-start gap-2">
              <span class="text-emerald-500 font-bold">✅</span>
              <div>
                <span class="font-bold">要求 4：能否用 AI 找到最新新聞資訊？</span><br>
                <span class="text-[var(--muted-foreground)]">超額完成：實作 RAG 檢索增強生成，不僅能查即時時事，還支援自訂關鍵字與二階段深度摘要！</span>
              </div>
            </div>
          </div>
        `
      },
      {
        tag: "03 · 系統架構",
        badge: "技術流程",
        title: "系統程式架構圖（運作流程）",
        body: `
          <div class="space-y-2 text-xs">
            <div class="p-2.5 rounded-xl bg-[var(--secondary)] border border-[var(--border)] font-mono text-[11px] leading-relaxed space-y-1">
              <div class="text-emerald-600 dark:text-emerald-400 font-bold">【前端】LINE 擬真介面 (index.html)</div>
              <div class="pl-3 text-[var(--muted-foreground)]">↓ 使用者輸入：「幫我查台積電新聞」 (HTTP POST /api/chat)</div>
              <div class="text-blue-500 font-bold">【後端】Flask 伺服器 (app.py)</div>
              <div class="pl-3 text-[var(--muted-foreground)]">↓ 正則過濾停用詞 ➔ 萃取關鍵字【台積電】</div>
              <div class="text-amber-500 font-bold">【資訊層】Google News RSS</div>
              <div class="pl-3 text-[var(--muted-foreground)]">↓ 即時抓取最新 5 則標題與內容 ➔ 存入 Session 記憶體</div>
              <div class="text-purple-500 font-bold">【AI 推理】本機 Ollama API (qwen2.5:3b)</div>
              <div class="pl-3 text-[var(--muted-foreground)]">↓ Prompt 注入新聞資料 ➔ 條列重點摘要 ➔ 彈出 LINE 氣泡！</div>
            </div>
          </div>
        `
      },
      {
        tag: "04 · 工具清單",
        badge: "技術堆疊",
        title: "使用到的程式工具、模型及其個別作用",
        body: `
          <div class="grid grid-cols-2 gap-2 text-xs">
            <div class="p-2 rounded-lg bg-[var(--secondary)] border border-[var(--border)]">
              <div class="font-bold text-amber-500">1. OpenCode</div>
              <div class="text-[var(--muted-foreground)]">終端機自主 AI 開發 Agent，負責依 Prompt 撰寫與重構專案程式碼。</div>
            </div>
            <div class="p-2 rounded-lg bg-[var(--secondary)] border border-[var(--border)]">
              <div class="font-bold text-purple-500">2. Ollama + Qwen 2.5</div>
              <div class="text-[var(--muted-foreground)]">本地模型運行容器與 3B 繁中神經網路大腦，負責新聞閱讀與多維度摘要。</div>
            </div>
            <div class="p-2 rounded-lg bg-[var(--secondary)] border border-[var(--border)]">
              <div class="font-bold text-blue-500">3. Python & Flask</div>
              <div class="text-[var(--muted-foreground)]">後端核心神經中樞，負責 API 路由、關鍵字清洗與多輪上下文狀態記憶。</div>
            </div>
            <div class="p-2 rounded-lg bg-[var(--secondary)] border border-[var(--border)]">
              <div class="font-bold text-emerald-500">4. Google News RSS</div>
              <div class="text-[var(--muted-foreground)]">即時資訊檢索外掛，提供毫秒級最新時事，徹底打破模型知識截止限制。</div>
            </div>
            <div class="p-2 rounded-lg bg-[var(--secondary)] border border-[var(--border)] col-span-2">
              <div class="font-bold text-cyan-500">5. Git & GitHub</div>
              <div class="text-[var(--muted-foreground)]">版本控制與工程軌跡存檔，完整記錄每個功能版本（Commit Traceability）。</div>
            </div>
          </div>
        `
      },
      {
        tag: "05 · 核心突破 1",
        badge: "RAG 實踐",
        title: "如何讓 AI 找到最新新聞？（RAG 原理解析）",
        body: `
          <div class="space-y-2 text-xs leading-relaxed">
            <p class="text-[var(--muted-foreground)]">
              <strong>問題癥結：</strong>大語言模型（LLM）的知識固定於訓練結束點，即使問它「今天的新聞」，本地模型也會產生幻覺或不知道。
            </p>
            <div class="p-2.5 rounded-xl bg-[var(--secondary)] border border-[var(--border)] space-y-1">
              <div class="font-bold text-emerald-600 dark:text-emerald-400">解法：檢索增強生成（Retrieval-Augmented Generation）</div>
              <div class="text-[var(--muted-foreground)]">
                1. <strong>自訂關鍵字提取</strong>：從使用者句子中分離出核心主詞（如「台積電」）。<br>
                2. <strong>動態檢索</strong>：向 Google News RSS 取得即時新聞。<br>
                3. <strong>上下文注入</strong>：把即時新聞內容以 Context 形式交給 Ollama 整理。
              </div>
            </div>
            <p class="text-[var(--muted-foreground)]">
              💡 <strong>成果：</strong>無需昂貴算力與重訓模型，就能讓本地 AI 擁有掌握當下新聞的能力！
            </p>
          </div>
        `
      },
      {
        tag: "06 · 核心突破 2",
        badge: "多輪對話",
        title: "延伸功能：多輪深度摘要（Drill-down）",
        badge: "創新亮點",
        body: `
          <div class="space-y-2.5 text-xs leading-relaxed">
            <p class="text-[var(--muted-foreground)]">
              不僅只有單純列出新聞，更實作了<strong>有狀態（Stateful）的多輪互動</strong>：
            </p>
            <div class="grid grid-cols-2 gap-2">
              <div class="p-2 rounded-lg bg-[var(--secondary)] border border-[var(--border)]">
                <div class="font-bold text-blue-500">第 1 輪：新聞標題概覽</div>
                <div class="text-[var(--muted-foreground)]">回傳 5 則最新時事重點，前端自動動態生成【📖 深入看第 1~5 則】快捷按鈕。</div>
              </div>
              <div class="p-2 rounded-lg bg-[var(--secondary)] border border-[var(--border)]">
                <div class="font-bold text-purple-500">第 2 輪：深度 4 大面向報告</div>
                <div class="text-[var(--muted-foreground)]">點擊按鈕或輸入「2」，後端鎖定該則新聞，產出深度剖析：</div>
              </div>
            </div>
            <div class="p-2 rounded-lg bg-purple-500/10 border border-purple-500/20 text-[11px] text-[var(--foreground)]">
              📌 事件核心 ｜ 🔍 詳細背景與經過 ｜ 💡 關鍵影響與展望 ｜ 🔗 新聞來源連結
            </div>
          </div>
        `
      },
      {
        tag: "07 · 開發歷程",
        badge: "工程規範",
        title: "真實工程歷程與 Git 軌跡紀錄",
        body: `
          <div class="space-y-2 text-xs leading-relaxed">
            <p class="text-[var(--muted-foreground)]">
              本專案全程嚴格遵守現代軟體工程規範，程式碼均妥善託管於 GitHub：
            </p>
            <div class="p-2.5 rounded-xl bg-[var(--secondary)] border border-[var(--border)] font-mono text-[11px] space-y-1.5 text-[var(--muted-foreground)]">
              <div>🔹 <span class="text-blue-500">c8d5f86</span> : 初版 LINE Bot 模擬系統與基礎新聞摘要</div>
              <div>🔹 <span class="text-emerald-500">eda851a</span> : 支援自訂關鍵字即時新聞搜尋（停用詞過濾）</div>
              <div>🔹 <span class="text-purple-500">0d7ced1</span> : 支援多輪上下文記憶與深度新聞分析</div>
              <div>🔹 <span class="text-amber-500">b001a83</span> : 修復 macOS AirPlay 通訊埠衝突（Port 5001）</div>
            </div>
            <p class="text-[var(--muted-foreground)]">
              證明每一次的功能迭代與問題排除，都有完整的版本歷程可受檢驗。
            </p>
          </div>
        `
      },
      {
        tag: "08 · 專案總結",
        badge: "報告結語",
        title: "總結：從專案中學到的重要能力",
        body: `
          <div class="space-y-2.5 text-xs leading-relaxed">
            <div class="p-2.5 rounded-xl bg-[var(--secondary)] border border-[var(--border)]">
              <div class="font-bold text-emerald-600 dark:text-emerald-400">1. AI 原生開發新思維</div>
              <div class="text-[var(--muted-foreground)]">體會身為「產品規劃者」如何透過精確的 Prompt 指揮 OpenCode Agent 實現複雜後端與前端架構。</div>
            </div>
            <div class="p-2.5 rounded-xl bg-[var(--secondary)] border border-[var(--border)]">
              <div class="font-bold text-emerald-600 dark:text-emerald-400">2. 本地開源大模型與隱私保護</div>
              <div class="text-[var(--muted-foreground)]">驗證本機 3B 模型在 Mac 上的流暢度，證明無需付費商業 API 也能建立高可用性對話系統。</div>
            </div>
            <div class="p-2.5 rounded-xl bg-[var(--secondary)] border border-[var(--border)]">
              <div class="font-bold text-emerald-600 dark:text-emerald-400">3. RAG 與多輪對話架構之落地</div>
              <div class="text-[var(--muted-foreground)]">完整理解外部資料檢索如何賦予 AI 實時感知能力，成功交付一套高完成度的智慧應用！</div>
            </div>
          </div>
        `
      }
    ];

    let currentSlide = 0;

    const slideContentEl = document.getElementById("slideContent");
    const slideCounterEl = document.getElementById("slideCounter");
    const progressBarEl = document.getElementById("progressBar");
    const prevBtn = document.getElementById("prevBtn");
    const nextBtn = document.getElementById("nextBtn");
    const dotContainerEl = document.getElementById("dotContainer");

    slides.forEach((_, i) => {
      const dot = document.createElement("button");
      dot.className = "w-2 h-2 rounded-full transition-all " + (i === 0 ? "bg-emerald-500 w-4" : "bg-[var(--border)]");
      dot.addEventListener("click", () => goToSlide(i));
      dotContainerEl.appendChild(dot);
    });

    function updateDots() {
      const dots = dotContainerEl.querySelectorAll("button");
      dots.forEach((dot, i) => {
        if (i === currentSlide) {
          dot.className = "h-2 rounded-full transition-all bg-emerald-500 w-4";
        } else {
          dot.className = "w-2 h-2 rounded-full transition-all bg-[var(--border)] hover:bg-[var(--muted-foreground)]";
        }
      });
    }

    function renderSlide() {
      const s = slides[currentSlide];
      slideCounterEl.textContent = `${currentSlide + 1} / ${slides.length}`;
      progressBarEl.style.width = `${((currentSlide + 1) / slides.length) * 100}%`;

      slideContentEl.innerHTML = `
        <div class="flex flex-col justify-center">
          <div class="flex items-center justify-between mb-2">
            <span class="text-xs font-mono font-semibold tracking-wider text-emerald-600 dark:text-emerald-400 uppercase">${s.tag}</span>
            <span class="text-[10px] font-semibold bg-[var(--secondary)] text-[var(--secondary-foreground)] px-2 py-0.5 rounded-md border border-[var(--border)]">${s.badge}</span>
          </div>
          <h3 class="text-base font-bold text-[var(--foreground)] mb-2.5 leading-snug">${s.title}</h3>
          ${s.body}
        </div>
      `;

      prevBtn.disabled = currentSlide === 0;
      if (currentSlide === slides.length - 1) {
        nextBtn.innerHTML = "<span>回到首頁</span> ↺";
        nextBtn.className = "px-4 py-1.5 text-xs font-semibold rounded-lg bg-emerald-700 text-white hover:bg-emerald-800 transition flex items-center gap-1";
      } else {
        nextBtn.innerHTML = "<span>下一頁</span> →";
        nextBtn.className = "px-4 py-1.5 text-xs font-semibold rounded-lg bg-emerald-600 text-white hover:bg-emerald-700 transition flex items-center gap-1";
      }

      updateDots();
    }

    function goToSlide(index) {
      if (index >= 0 && index < slides.length) {
        currentSlide = index;
        renderSlide();
      }
    }

    prevBtn.addEventListener("click", () => goToSlide(currentSlide - 1));
    nextBtn.addEventListener("click", () => {
      if (currentSlide < slides.length - 1) {
        goToSlide(currentSlide + 1);
      } else {
        goToSlide(0);
      }
    });

    window.addEventListener("keydown", (e) => {
      if (e.key === "ArrowLeft") goToSlide(currentSlide - 1);
      if (e.key === "ArrowRight") goToSlide(currentSlide + 1);
    });

    renderSlide();
  </script>
</body>
</html>
