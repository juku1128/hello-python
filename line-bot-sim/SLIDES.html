      const dots = dotContainerEl.querySelectorAll("button");
      dots.forEach((dot, i) => {
        if (i === currentSlide) {
          dot.className = "h-2 rounded-full transition-all bg-emerald-500 w-3.5 flex-shrink-0";
        } else {
          dot.className = "w-2 h-2 rounded-full transition-all bg-[var(--border)] hover:bg-[var(--muted-foreground)] flex-shrink-0";
        }
      });
    }

      const s = slides[currentSlide];
      slideCounterEl.textContent = `${currentSlide + 1} / ${slides.length}`;
      progressBarEl.style.width = `${((currentSlide + 1) / slides.length) * 100}%`;

          </div>
          <h3 class="text-sm sm:text-base font-bold text-[var(--foreground)] mb-2 leading-snug">${s.title}</h3>

        </div>

      if (currentSlide === slides.length - 1) {
        nextBtn.innerHTML = "<span>回到首頁</span> ↺";
        nextBtn.className = "px-3.5 py-1 text-xs font-semibold rounded-lg bg-emerald-700 text-white hover:bg-emerald-800 transition flex items-center gap-1";
      } else {
        nextBtn.innerHTML = "<span>下一頁</span> →";
        nextBtn.className = "px-3.5 py-1 text-xs font-semibold rounded-lg bg-emerald-600 text-white hover:bg-emerald-700 transition flex items-center gap-1";
      }

      updateDots();
    }

    function goToSlide(index) {
      if (index >= 0 && index < slides.length) {
        currentSlide = index;
        renderSlide();
      }
    }

    prevBtn.addEventListener("click", () => goToSlide(currentSlide - 1));
    nextBtn.addEventListener("click", () => {
      if (currentSlide < slides.length - 1) {
        goToSlide(currentSlide + 1);
      } else {
        goToSlide(0);
      }
    });

    window.addEventListener("keydown", (e) => {
      if (e.key === "ArrowLeft") goToSlide(currentSlide - 1);
      if (e.key === "ArrowRight") goToSlide(currentSlide + 1);
    });

    renderSlide();
  </script>
</body>
</html>
